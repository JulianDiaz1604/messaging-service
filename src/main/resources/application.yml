server:
  port: 8083

spring:
  application:
    name: messaging-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:messaging}
    username: ${DB_USERNAME:plazoleta}
    password: ${DB_PASSWORD:plazoleta}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

appDescription: "messaging-service - Plazoleta de comidas (PRAGMA)"
appVersion: "1.0.0"

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  sns:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_SNS_ENDPOINT:http://localhost:4566}
