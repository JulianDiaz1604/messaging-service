server:
  port: 8083

spring:
  application:
    name: messaging-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:messaging}
    username: ${DB_USERNAME:plazoleta}
    password: ${DB_PASSWORD:plazoleta}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

appDescription: "messaging-service - Plazoleta de comidas (PRAGMA)"
appVersion: "1.0.0"

# Real AWS SNS. Credentials come from the standard AWS provider chain
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, shared config, or IAM role).
aws:
  sns:
    region: ${AWS_REGION:us-east-1}

jwt:
  # Shared secret — MUST match users-service so this service can verify the forwarded tokens.
  secret: ${JWT_SECRET:change-me-plazoleta-shared-jwt-secret-key-32bytes-min}
