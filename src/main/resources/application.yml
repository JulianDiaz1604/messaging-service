server:
  port: 8083

spring:
  application:
    name: messaging-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:messaging}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

appDescription: "messaging-service - Plazoleta de comidas (PRAGMA PowerUp)"
appVersion: "1.0.0"
